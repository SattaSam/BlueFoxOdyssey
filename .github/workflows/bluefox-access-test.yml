name: BlueFox Access Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bluefox-access-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Show Git state
        run: |
          echo "BLUEFOX_ACTIONS_ACCESS_TEST=OK"
          echo "SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          git status --short
          node --version
          npm --version

      - name: Create proof artifact
        run: |
          mkdir -p bluefox-proof
          {
            echo "BLUEFOX_ACTIONS_ACCESS_TEST=OK"
            echo "SHA=${GITHUB_SHA}"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "NODE=$(node --version)"
          } > bluefox-proof/result.txt

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: bluefox-access-proof
          path: bluefox-proof/result.txt
