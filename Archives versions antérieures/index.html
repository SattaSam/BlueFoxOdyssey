<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueFox Odyssey — V0.8 Part 6 Hotfix</title>
  <link rel="stylesheet" href="./css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="game-root" aria-label="BlueFox Odyssey">
    <section id="status-panel">
      <h1>BlueFox Odyssey</h1>
      <p id="status">Initialisation de la scène 3D…</p>
      <p class="help">Maintiens le clic gauche pour tourner la caméra. Molette pour zoomer.</p>
    </section>
  </main>

  <noscript>JavaScript doit être activé pour lancer BlueFox Odyssey.</noscript>

  <script type="module">
    import { createScene } from "./js/three_scene.js";

    const status = document.querySelector("#status");

    createScene(document.querySelector("#game-root"), {
      onStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }
    }).catch((error) => {
      console.error(error);
      status.textContent =
        "Échec du lancement. Utilise START_BLUEFOX.bat au lieu d’ouvrir index.html par double-clic.";
      status.classList.add("error");
    });
  </script>
</body>
</html>
